<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">System Flow</title>
  <desc id="desc">設定読込から壁紙表示までのシステムフロー図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8e26f"/>
    </marker>
    <style>
      .bg { fill: #141a12; }
      .box { fill: #20281b; stroke: #d8e26f; stroke-width: 2; rx: 12; ry: 12; }
      .line { stroke: #d8e26f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { fill: #f2f1b2; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 22px; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 20px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="360"/>

  <rect class="box" x="30" y="120" width="110" height="70"/>
  <text class="label" x="85" y="155">設定読込</text>

  <rect class="box" x="160" y="120" width="110" height="70"/>
  <text class="label" x="215" y="155">センサ取得</text>

  <rect class="box" x="290" y="120" width="110" height="70"/>
  <text class="label" x="345" y="155">傾き計算</text>

  <rect class="box" x="420" y="110" width="145" height="90"/>
  <text class="label small" x="492.5" y="155">レイヤー別</text>
  <text class="label small" x="492.5" y="179">パラメータ生成</text>

  <rect class="box" x="585" y="110" width="145" height="90"/>
  <text class="label small" x="657.5" y="155">シェーダによる</text>
  <text class="label small" x="657.5" y="179">ノイズ生成</text>

  <rect class="box" x="750" y="120" width="110" height="70"/>
  <text class="label" x="805" y="155">レイヤー合成</text>

  <rect class="box" x="390" y="250" width="120" height="70"/>
  <text class="label" x="450" y="285">壁紙表示</text>

  <path class="line" d="M 140 155 L 160 155"/>
  <path class="line" d="M 270 155 L 290 155"/>
  <path class="line" d="M 400 155 L 420 155"/>
  <path class="line" d="M 565 155 L 585 155"/>
  <path class="line" d="M 730 155 L 750 155"/>
  <path class="line" d="M 805 190 L 805 230 L 510 230 L 510 250"/>
</svg>
